name: ci
on:
  push:
    branches:
      - main
      - release/*
  pull_request:
  merge_group:
  release:
    types:
      - published

jobs:
  build:
    name: 'build'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_go: true
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
          cache: true
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: build libraries
        run: 'pnpm run build'
      - name: store libraries archives
        uses: actions/upload-artifact@v7
        with:
          name: archives
          path: |
            **/dist
            !node_modules

  lint-npm:
    name: 'lint-npm'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check

  test-npm:
    name: 'test-npm'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  type-check:
    name: 'type-check'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check

  # Packages are developed against React 18 (the minimum supported version); also validate them against React 19.
  react-19:
    name: 'type-check & test (React 19)'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --workspace-root --save-dev react@^19 react-dom@^19 @types/react@^19 @types/react-dom@^19
      - name: Assert React 19 is installed
        run: node -e "const v=require('react/package.json').version; if(!v.startsWith('19.')){console.error('Expected React 19, got',v);process.exit(1)}"
      - run: pnpm run type-check
      - run: pnpm run test

  release:
    name: 'release'
    needs: 'build'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC trusted publishing
      contents: read
    if: ${{ github.event.release.tag_name }}
    env:
      GITHUB_TOKEN: ${{ github.TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_go: true
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
          cache: true
      - name: Download archive
        uses: actions/download-artifact@v8
        with:
          name: archives
      - name: Publish npm package
        run: go run ./scripts/npm-publish/npm-publish.go -tag=${{ github.event.release.tag_name }}
